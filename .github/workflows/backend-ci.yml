name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test Backend Server
        working-directory: backend/backend-server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -v

      - name: Test Load Balancer (when present)
        run: |
          if [ -f "backend/load-balancer/requirements.txt" ]; then
            cd backend/load-balancer
            pip install -r requirements.txt
            pytest -v
          else
            echo "Load balancer not yet implemented, skipping."
          fi
