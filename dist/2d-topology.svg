<svg xmlns="http://www.w3.org/2000/svg" fill="none" focusable="false" stroke="#111111" stroke-width="1" viewBox="0 0 560 440" width="560" height="440" role="img" aria-labelledby="topo-title" aria-describedby="topo-desc" style="overflow:visible;font-family:Cal Sans, sans-serif;font-weight:400;color:#111111">
  <title id="topo-title">Load balancer 2D topology</title>
  <desc id="topo-desc">Three ingress client streams converge at a central VIP distributor and route across an array of three backend compute nodes.</desc>
  
  <!-- Subtle Reference Grid -->
  <g opacity="0.06" stroke-width="1">
    <path d="M60 40H500M60 140H500M60 220H500M60 310H500M60 400H500" />
    <path d="M140 30V410M280 30V410M420 30V410" />
  </g>
  
  <!-- Corner Registration Datum Marks -->
  <g opacity="0.2" stroke-width="1">
    <path d="M40 36h12M46 30v12M508 36h12M514 30v12M40 404h12M46 398v12M508 404h12M514 398v12" />
  </g>

  <!-- Major Alignment Axes (8 3 1 3) -->
  <g opacity="0.14" stroke-dasharray="8 3 1 3" stroke-width="1">
    <path d="M80 80h400M80 205h400M80 345h400" />
    <path d="M140 40v370M280 40v370M420 40v370" />
  </g>

  <!-- Ingress Clients (Top Row) -->
  <g stroke-width="1" opacity="0.95">
    <rect x="104" y="60" width="72" height="40" rx="6" />
    <rect x="244" y="60" width="72" height="40" rx="6" />
    <rect x="384" y="60" width="72" height="40" rx="6" />
  </g>

  <!-- Ingress Feeder Lines (Dark Black) -->
  <path d="M140 100v24a16 16 0 0 0 16 16h108a16 16 0 0 1 16 16v14" opacity="0.75" stroke-dasharray="4 6" stroke-width="1" />
  <path d="M280 100v70" opacity="0.95" stroke-width="1" />
  <path d="M277 164l3 6 3-6" stroke-width="1" opacity="0.95" />
  <path d="M420 100v24a16 16 0 0 1-16 16H296a16 16 0 0 0-16 16v14" opacity="0.75" stroke-dasharray="4 6" stroke-width="1" />

  <!-- Load Balancer Node (Center) -->
  <rect x="212" y="170" width="136" height="70" rx="8" fill="#111111" fill-opacity="0.055" stroke="none" />
  <rect x="212" y="170" width="136" height="70" rx="8" stroke-width="1" opacity="0.95" />
  <path d="M212 215h136M280 170v45" opacity="0.4" stroke-width="1" />
  <circle cx="280" cy="215" r="3" stroke-width="1" opacity="0.95" />

  <!-- Outbound Dispatch Routes (Dark Black) -->
  <g opacity="0.75" stroke-width="1" stroke-dasharray="4 6">
    <path d="M260 240v16a20 20 0 0 1-20 20h-80a20 20 0 0 0-20 20v14" />
    <path d="M137 304l3 6 3-6" stroke-dasharray="none" />
  </g>
  <g opacity="0.95" stroke-width="1">
    <path d="M280 240v70" />
    <path d="M277 304l3 6 3-6" />
  </g>
  <g opacity="0.75" stroke-width="1" stroke-dasharray="4 6">
    <path d="M300 240v16a20 20 0 0 0 20 20h80a20 20 0 0 1 20 20v14" />
    <path d="M417 304l3 6 3-6" stroke-dasharray="none" />
  </g>

  <!-- Backend Servers (Bottom Row) -->
  <g stroke-width="1" opacity="0.95">
    <rect x="92" y="314" width="96" height="62" rx="6" />
    <rect x="232" y="314" width="96" height="62" rx="6" fill="#111111" fill-opacity="0.055" />
    <rect x="232" y="314" width="96" height="62" rx="6" />
    <rect x="372" y="314" width="96" height="62" rx="6" />
  </g>

  <!-- Server Internal Rack Slots & Activity Marks -->
  <g opacity="0.35" stroke-width="1">
    <path d="M98 338h84M98 354h84" />
    <path d="M238 338h84M238 354h84" />
    <path d="M378 338h84M378 354h84" />
    <circle cx="166" cy="366" r="2" />
    <circle cx="306" cy="366" r="2" />
    <circle cx="446" cy="366" r="2" />
  </g>

  <!-- High-contrast Labels -->
  <g fill="#111111" font-size="11" opacity="0.75" stroke="none" text-anchor="middle">
    <text x="140" y="81">Client 01</text>
    <text x="280" y="81">Client 02</text>
    <text x="420" y="81">Client 03</text>
    <text x="280" y="192">Load balancer</text>
    <text x="140" y="332">Server 01</text>
    <text x="280" y="332">Server 02</text>
    <text x="420" y="332">Server 03</text>
  </g>

  <g fill="#111111" font-size="10" opacity="0.55" stroke="none">
    <text text-anchor="middle" x="140" y="93">192.168.1.11</text>
    <text text-anchor="middle" x="280" y="93">192.168.1.12</text>
    <text text-anchor="middle" x="420" y="93">192.168.1.13</text>
    <text text-anchor="middle" x="280" y="204">VIP 10.0.0.1:443</text>
    <text text-anchor="middle" x="280" y="232">Round robin dispatch</text>
    <text text-anchor="start" x="104" y="368">Pool A · 8080</text>
    <text text-anchor="start" x="244" y="368">Pool A · 8080</text>
    <text text-anchor="start" x="384" y="368">Pool A · 8080</text>
  </g>
</svg>